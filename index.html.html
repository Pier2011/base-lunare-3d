<title>Base lunare in caverna – modello 3D</title>
<style>
:root{--bg:#05070b;--panel:#10151cEE;--ink:#e8edf3;--mute:#8d9aab;--line:#2f3a48;--acc:#6cc4ff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Avenir Next","Segoe UI",Helvetica,Arial,sans-serif;overflow:hidden}
#app{position:relative;height:100%;overflow:hidden}
#app::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse at 50% 55%,transparent 55%,rgba(0,0,0,.6))}
#tabs,#card,header{z-index:2}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
header{position:absolute;left:16px;top:12px;pointer-events:none;max-width:60%}
h1{margin:0;font-size:clamp(16px,3.2vw,24px);font-weight:600}
header p{margin:4px 0 0;color:var(--mute);font-size:12.5px}
#labs{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lab{position:absolute;transform:translate(-50%,-100%);background:#0a0e14dd;border:1px solid #e8edf366;padding:3px 7px;font-size:11.5px;line-height:1.25;white-space:nowrap;pointer-events:auto;cursor:pointer;border-radius:2px}
.lab b{display:block;font-weight:600}.lab i{display:block;font-style:normal;color:#aab6c5;font-size:10.5px}
.lab.on{border-color:var(--acc);color:var(--acc)}
.lab.dim{pointer-events:none;border:0;background:none;color:#cfd8e3;font-size:13px;transform:translate(-50%,-50%)}
#labs.min .lab i{display:none}
#labs.off .lab{display:none}
#card{position:absolute;left:12px;right:12px;bottom:12px;max-width:440px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:10px;padding:14px 16px;backdrop-filter:blur(8px)}
#card h2{margin:0 0 2px;font-size:18px}
#card .sub{color:var(--acc);font-size:13px;margin-bottom:8px}
#card p{margin:0;font-size:14px;line-height:1.5;color:#cfd8e3}
#card.hint{border-left-color:var(--line)}
#card.hint h2{font-size:15px;color:var(--mute);font-weight:500}
#tabs{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px;max-height:75%;overflow:auto}
#tabs button{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 11px;font:inherit;font-size:12.5px;text-align:left;cursor:pointer}
#tabs button:hover,#tabs button.on{border-color:var(--acc);color:var(--acc)}
#tabs button:focus-visible{outline:2px solid var(--acc)}
@media(max-width:700px){#tabs{flex-direction:row;left:12px;top:68px;max-height:none;overflow-x:auto}#tabs button{white-space:nowrap}header{max-width:90%}}
</style>
</head>
